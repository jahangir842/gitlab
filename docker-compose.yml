services:
  gitlab:
    image: 'gitlab/gitlab-ce:18.9.0-ce.0' 
    restart: always
    hostname: 'gitlab.centaic.ai'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.centaic.ai'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
    ports:
      - '80:80'
      - '443:443'
      - '2222:22'
    volumes:
      - './config:/etc/gitlab'
      - './logs:/var/log/gitlab'
      - './data:/var/opt/gitlab'
    shm_size: '256m'
